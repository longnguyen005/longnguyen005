<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Nguyen Thanh Long - Fullstack Web Developer">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="15%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#gridDark)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glowIndigo)"/>

  <!-- Top Accent Line -->
  <rect x="56" y="1" width="180" height="3" rx="1.5" fill="url(#accentDark)"/>

  <!-- Status Pill -->
  <rect x="56" y="34" width="308" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="74" cy="48" r="4.5" fill="#34d399"/>
  <text x="88" y="52" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">OPEN TO WEB DEVELOPER ROLES</text>

  <!-- Main Heading & Role -->
  <text x="56" y="112" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Nguyen Thanh Long</text>
  <text x="56" y="150" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Fullstack Web Developer  ·  Frontend &amp; Backend</text>
  <text x="56" y="186" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Building production-minded web apps with React, TypeScript, Node.js, Express, PostgreSQL &amp; MongoDB.</text>

  <!-- Contact Chips -->
  <rect x="56" y="214" width="298" height="32" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="72" y="235" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">✉ thanhlongnguyen101105@gmail.com</text>

  <rect x="366" y="214" width="228" height="32" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="382" y="235" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">github.com/longnguyen005</text>

  <!-- Right Code Card -->
  <rect x="768" y="34" width="380" height="212" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.2"/>
  <rect x="768" y="34" width="380" height="34" rx="12" fill="#111827"/>
  <rect x="768" y="56" width="380" height="12" fill="#111827"/>
  <line x1="768" y1="68" x2="1148" y2="68" stroke="#1e293b" stroke-width="1"/>

