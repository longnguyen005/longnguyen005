  <circle cx="790" cy="51" r="5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="806" cy="51" r="5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="822" cy="51" r="5" fill="#10b981" fill-opacity="0.85"/>
  <text x="844" y="55" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">stack.config.ts</text>

  <!-- Code Content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="788" y="96"><tspan fill="#c084fc">export const</tspan> <tspan fill="#38bdf8">profile</tspan> <tspan fill="#e2e8f0">=</tspan> <tspan fill="#94a3b8">{</tspan></text>
    <text x="788" y="122"><tspan fill="#e2e8f0">  frontend:</tspan> <tspan fill="#34d399">["React", "TypeScript"]</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="788" y="148"><tspan fill="#e2e8f0">  backend:</tspan>  <tspan fill="#34d399">["Node.js", "Express"]</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="788" y="174"><tspan fill="#e2e8f0">  database:</tspan> <tspan fill="#34d399">["PostgreSQL", "MongoDB"]</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="788" y="200"><tspan fill="#e2e8f0">  devops:</tspan>   <tspan fill="#34d399">["Docker", "Git"]</tspan></text>
    <text x="788" y="226"><tspan fill="#94a3b8">};</tspan></text>
