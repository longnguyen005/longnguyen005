<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Nguyen Thanh Long - Fullstack Web Developer">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="15%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bgLight)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#gridLight)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glowSky)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glowViolet)"/>

  <!-- Top Accent Line -->
