  <!-- Status Pill -->
  <rect x="56" y="34" width="308" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="74" cy="48" r="4.5" fill="#10b981"/>
  <text x="88" y="52" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">OPEN TO WEB DEVELOPER ROLES</text>

  <!-- Main Heading & Role -->
  <text x="56" y="112" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Nguyen Thanh Long</text>
  <text x="56" y="150" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Fullstack Web Developer  ·  Frontend &amp; Backend</text>
  <text x="56" y="186" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Building production-minded web apps with React, TypeScript, Node.js, Express, PostgreSQL &amp; MongoDB.</text>

  <!-- Contact Chips -->
  <rect x="56" y="214" width="298" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="235" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">✉ thanhlongnguyen101105@gmail.com</text>

  <rect x="366" y="214" width="228" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="382" y="235" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">github.com/longnguyen005</text>

  <!-- Right Code Card -->
  <rect x="768" y="34" width="380" height="212" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="768" y="34" width="380" height="34" rx="12" fill="#f1f5f9"/>
  <rect x="768" y="56" width="380" height="12" fill="#f1f5f9"/>
  <line x1="768" y1="68" x2="1148" y2="68" stroke="#e2e8f0" stroke-width="1"/>

