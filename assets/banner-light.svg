  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="788" y="96"><tspan fill="#7c3aed">export const</tspan> <tspan fill="#0284c7">profile</tspan> <tspan fill="#0f172a">=</tspan> <tspan fill="#64748b">{</tspan></text>
    <text x="788" y="122"><tspan fill="#1e293b">  frontend:</tspan> <tspan fill="#059669">["React", "TypeScript"]</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="788" y="148"><tspan fill="#1e293b">  backend:</tspan>  <tspan fill="#059669">["Node.js", "Express"]</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="788" y="174"><tspan fill="#1e293b">  database:</tspan> <tspan fill="#059669">["PostgreSQL", "MongoDB"]</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="788" y="200"><tspan fill="#1e293b">  devops:</tspan>   <tspan fill="#059669">["Docker", "Git"]</tspan></text>
    <text x="788" y="226"><tspan fill="#64748b">};</tspan></text>
